<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts, ideas, and tasks instantly.</p>
    </header>

    <main>
        <section id="add-note-section">
            <h2>Add a note</h2>
            <form id="note-form">
                <div class="form-group input-group">
                    <label for="note-input">Note text</label>
                    <input type="text" id="note-input" placeholder="What's on your mind?">
                </div>

                <div class="form-group select-group">
                    <label for="note-category">Category</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>

                <button type="submit" id="add-note-btn">Add Note</button>
            </form>
            <p id="error-message"></p>
        </section>

        <section id="your-notes-section">
            <div class="notes-header">
                <h2>Your notes</h2>
                <button type="button" id="clear-all-btn">Clear all</button>
            </div>

            <div class="search-container">
                <label for="search-input" class="sr-only">Search notes</label>
                <input type="text" id="search-input" placeholder="Search notes...">
            </div>

            <p id="note-count">You have no notes yet.</p>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Built with semantic HTML, modern CSS, and vanilla JavaScript.</p>
    </footer>
</body>
</html>
